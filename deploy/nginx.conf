# harness-factory 리버스 프록시 — 포트 80 → 앱 컨테이너의 8000.
# 목적: 공개 URL 에서 `:8000` 을 없앤다. (http://harness-factory.kr:8000 → http://harness-factory.kr)
#
# 이 파일은 `deploy.yml` 이 nginx 컨테이너에 읽기전용으로 마운트한다:
#   /etc/nginx/conf.d/default.conf
# 설정을 바꾸면 배포 때 `nginx -t` 로 검증하고 `nginx -s reload` 로 무중단 적용된다.

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name harness-factory.kr www.harness-factory.kr _;

    # 앱이 5MB 를 자체 한도로 검사해 자기 메시지로 413 을 돌려준다(app.py MAX_BODY_BYTES).
    # 프록시 한도를 조금 크게 둬서 한도 초과 응답을 앱이 내게 한다(프록시 기본 413 페이지 대신).
    client_max_body_size 6m;

    # 접속 로그에 프록시 자신의 IP 가 아니라 실제 클라이언트가 남게 한다.
    real_ip_header X-Forwarded-For;

    # 도커 임베디드 DNS. 배포 때 앱 컨테이너가 교체되면 컨테이너 IP 가 바뀌는데,
    # proxy_pass 에 이름을 **직접** 쓰면 nginx 가 기동 시점의 IP 를 캐시해 그 뒤로 502 가 된다.
    # 변수로 넘기면 요청마다 다시 해석하므로 컨테이너 교체를 그대로 따라간다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream "http://harness-factory:8000";
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 하네스 생성(zip 빌드)은 몇 초 걸릴 수 있다. 업스트림이 죽었을 때는 빨리 포기한다.
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # zip 응답을 디스크에 모아두지 않고 그대로 흘려보낸다(다운로드 지연·디스크 사용 감소).
        proxy_buffering off;
    }
}
