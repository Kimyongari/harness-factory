# harness-factory 리버스 프록시 — 포트 80 → 앱의 8000.
# 목적: 공개 URL 에서 `:8000` 을 없앤다. (http://harness-factory.kr:8000 → http://harness-factory.kr)
#
# 이 파일은 nginx 컨테이너에 읽기전용으로 마운트된다: /etc/nginx/conf.d/default.conf
# 설정을 바꾸면 배포가 `nginx -t` 로 검증하고 `nginx -s reload` 로 무중단 적용한다.
#
# 왜 컨테이너 이름이 아니라 127.0.0.1 인가:
#   프록시는 `--network host` 로 뜬다. 그래서 앱을 **호스트 포트**로 찾는다.
#   앱 컨테이너는 배포마다 교체되며 컨테이너 IP 가 바뀌지만, 호스트 포트 8000 은 그대로다.
#   컨테이너 이름으로 찾으면(사용자 정의 네트워크 + 도커 DNS) 이름 해석 캐시·네트워크 재구성 같은
#   변수가 하나 더 늘어난다. 호스트 포트가 가장 단순하고 교체에 영향받지 않는 경계다.

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name harness-factory.kr www.harness-factory.kr _;

    # 앱이 5MB 를 자체 한도로 검사해 자기 메시지로 413 을 돌려준다(app.py MAX_BODY_BYTES).
    # 프록시 한도를 조금 크게 둬서 한도 초과 응답을 앱이 내게 한다(nginx 기본 413 페이지 대신).
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 하네스 생성(zip 빌드)은 몇 초 걸릴 수 있다. 업스트림이 죽었을 때는 빨리 포기한다.
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # zip 응답을 디스크에 모아두지 않고 그대로 흘려보낸다(다운로드 지연·디스크 사용 감소).
        proxy_buffering off;
    }
}
