# harness-factory HTTPS(443) 서버. 앱의 8000 으로 넘기는 것은 nginx.conf 의 80 서버와 같다.
#
# 이 파일은 인증서가 있을 때만 프록시 컨테이너에 마운트된다(deploy/remote-deploy.sh 의 CERT_LIVE 분기).
# 인증서 없이 이 파일을 읽으면 nginx 가 기동하지 못하고 80 까지 함께 내려가기 때문이다.
# 인증서 발급과 자동 갱신은 deploy/issue-cert.sh 가 서버에서 한 번 설정한다.
#
# HTTP 는 리다이렉트하지 않고 그대로 둔다. 80 과 443 이 같은 앱을 보여 준다.

server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name harness-factory.kr;

    ssl_certificate     /etc/letsencrypt/live/harness-factory.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harness-factory.kr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 80 서버와 같은 한도. 앱(app.py MAX_BODY_BYTES)이 413 을 자기 메시지로 내게 한다.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_buffering off;
    }
}
