name: Deploy

# main이 변경될 때마다 OCI 인스턴스로 SSH 접속해 재배포한다.
# 수동 실행도 가능(workflow_dispatch).
#
# 배포 본체는 서버의 `deploy/remote-deploy.sh` 다. CI 는 그것을 **분리 실행(setsid)** 하고
# 결과 파일만 폴링한다. SSH 채널 안에서 배포를 돌리면 채널이 끊기는 순간 배포가 중단되는데,
# 실제로 그 일이 두 번 있었다(앱 컨테이너 재기동 직후 세션이 출력도 종료 트랩도 없이 사망).
# 세션에서 떼어내면 원인이 무엇이든 배포는 끝까지 진행되고, 로그가 남는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 배포를 직렬화한다. 진행 중인 배포는 취소하지 않는다(스왑 도중 취소되면
  # 사이트가 내려간 채로 남을 수 있으므로, 각 배포가 끝까지 완료되게 둔다).
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Launch deploy on server (detached)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # 배포 스크립트 자체를 최신으로 맞춘 뒤 그것을 실행한다.
            sudo git fetch --all --prune
            sudo git reset --hard origin/main
            sudo chmod +x deploy/remote-deploy.sh

            mkdir -p deploy-logs
            rm -f deploy-logs/last-status      # 폴링이 이전 실행 결과를 보지 않도록

            # setsid + nohup: SSH 세션이 닫혀도(혹은 끊겨도) 배포는 계속된다.
            setsid nohup bash deploy/remote-deploy.sh \
              "${{ github.sha }}" "${{ github.actor }}" \
              "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              > deploy-logs/launch.log 2>&1 < /dev/null &

            sleep 2
            echo "배포를 분리 실행으로 시작했다. 결과는 다음 스텝에서 폴링한다."

      - name: Wait for deploy result and print log
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -uo pipefail
            cd "${{ secrets.DEPLOY_PATH }}/deploy-logs"

            # 배포 스크립트가 종료 트랩에서 last-status 를 쓴다. 최대 12분 대기.
            for _ in $(seq 1 144); do
              [ -f last-status ] && break
              sleep 5
            done

            LATEST="$(ls -1t *-*.log 2>/dev/null | head -1)"
            echo "===== 이번 실행 로그 (${LATEST:-없음}) ====="
            [ -n "${LATEST}" ] && tail -60 "${LATEST}"
            echo
            echo "===== 최근 배포 이력 (history.log) ====="
            tail -10 history.log 2>/dev/null || echo "(이력 없음)"
            echo

            if [ ! -f last-status ]; then
              echo "::error::배포가 12분 안에 끝나지 않았다. 서버에서 deploy-logs 를 확인하라."
              exit 1
            fi

            STATUS="$(cat last-status)"
            echo "결과: ${STATUS}"
            case "${STATUS}" in
              SUCCESS*) exit 0 ;;
              *) echo "::error::배포 실패 — ${STATUS}"; exit 1 ;;
            esac
