[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-factory"
version = "0.5.0"
description = "설문 몇 개로 Claude Code / Codex / Cursor용 에이전트 하네스를 만들어 zip으로 받는다."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.8", "pre-commit>=3.7"]

[project.scripts]
harness-factory = "harness_maker.app:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_maker = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." → evals 패키지 임포트
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# evals/tasks 는 일부러 결함을 심은 픽스처(린트 오류 등)라 검사 대상에서 제외한다.
# 주의: 이 규칙만으로는 부족하다. 일부 픽스처는 자체 pyproject.toml 을 갖고 있어서 ruff 가
# 그것을 설정 파일로 잡고 이 설정을 읽지 않는다 → 훅 레이어 제외가 실제 방어선이다
# (.pre-commit-config.yaml 의 exclude 주석 참고).
extend-exclude = ["src/harness_maker/static/vendor/**", "evals/tasks/**"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, C4: comprehensions
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length is handled by the formatter
